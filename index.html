<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><meta name="robots" content="noindex, nofollow">
<title>Bobcat Campaign Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
</head><body>
<style>
/* Layout: placeholder Flint brand (steel blue) leads; Bobcat orange appears only on the partner mark.
   Three switchable desktop layouts share one data set, one detail drawer and one enrollment flow. */
:root {
  /* Neutrals: charcoal and warm grays (follows Bobcat black/white) so orange and cyan are the only colors */
  /* Off-whites: a warm, slightly dirty paper tone; cards a shade lighter than the page, nothing pure white */
  --bg: #efe9df;
  --surface: #f7f3ec;
  --how-bg: #f5e2d6;       /* How it works band: light Bobcat orange tint */
  --ink: #1a1a1a;
  --muted: #5f5b54;
  --line: #dcd4c7;
  --neutral-soft: #e6dfd3; /* minimum pills, internal flags */
  --band: #e5ddd0;         /* footer: a shade deeper than the page */
  --on-band: #1a1a1a;
  /* Flint Direct brand cyan, sampled from the flame logo */
  --accent: #1bbed7;       /* fills, timer, wordmark, big numbers */
  --accent-soft: #dcefee;  /* cyan tint, warmed to sit on the off-white */
  --accent-text: #0a7487;  /* same hue, dark enough for small text on white */
  --on-accent: #062a31;    /* text on cyan fills (white is too faint on this cyan) */
  --partner: #ff3600;      /* Bobcat orange, RGB 255, 54, 0 (brand guide) */
  --partner-text: #c72a00; /* same orange, deepened only for small text on white */
  --bobcat-black: #000000; /* Bobcat guide: CMYK 0,0,0,100 */
  --bobcat-white: #ffffff; /* Bobcat guide: CMYK 0,0,0,0 */
  --sky: var(--accent);
  /* Status: green = added / co-op savings; red = errors and duplicate flags only */
  --good: #1f7a4d;
  --good-soft: #e3f3ea;
  --warn: #c0262d;
  --warn-soft: #fbe9ea;
  --shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 6px 20px rgba(0, 0, 0, .06);
  --display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); padding-bottom: 96px; }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: 3rem; }
h2 { font-size: 1.9rem; }
h3 { font-size: 1.45rem; }
p { margin: 0; }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1200px; margin: 0 auto; padding-inline: 32px; }

/* Review bar: not part of the dealer page */
.review { background: var(--ink); color: var(--bg); font-size: .9rem; }
.review .wrap { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding-block: 10px; }
.review strong { letter-spacing: .06em; text-transform: uppercase; font-size: .78rem; }
.review .opts { display: flex; gap: 6px; flex-wrap: wrap; }
.review button { background: transparent; color: var(--bg); border: 1px solid color-mix(in srgb, var(--bg) 40%, transparent); border-radius: 999px; padding: 4px 14px; }
.review button[aria-pressed="true"] { background: var(--bg); color: var(--ink); }
.review .note { margin-left: auto; opacity: .75; }

/* Site header */
.site-head { background: var(--surface); border-bottom: 1px solid var(--line); }
.site-head .wrap { display: flex; align-items: center; gap: 16px; padding-block: 16px; }
.brand { display: flex; align-items: center; gap: 10px; }
.logo { height: 34px; width: auto; display: block; }
.wordmark { font-family: var(--display); font-size: 1.2rem; font-weight: 700; letter-spacing: .08em; color: var(--accent); }
.partner { display: flex; align-items: center; gap: .3em; color: var(--bobcat-black); font-family: var(--display); font-size: 1.2rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; line-height: 1; padding-left: 16px; border-left: 1px solid var(--line); }
.site-head .help .help-email { color: var(--sky); }
.partner b { color: var(--partner); font: inherit; }
.site-head .help { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; color: var(--ink); font-size: .95rem; font-weight: 700; }
/* Phone spacing: hero, How it works and sections tightened so more of the page shows per screen */
@media (max-width: 640px) {
  body .hero .wrap { padding-block: 22px 26px; gap: 18px; }
  body .hero-kicker { font-size: 1.1rem; letter-spacing: .04em; }
  body .hero h1 { font-size: 2.2rem; margin-top: 4px !important; }
  body .hero p.lead { font-size: 1rem; margin-top: 8px; }
  body .deadline-box { padding: 16px; gap: 10px; }
  body .how .wrap { padding-block: 20px 10px; gap: 12px; }
  body .how-title { font-size: 1.3rem; }
  body .how-steps { row-gap: 2px; gap: 0; }
  body .how-steps li { margin-bottom: 14px; grid-template-columns: 38px minmax(0, 1fr); }
  body .how-steps li::before { width: 34px; height: 34px; font-size: 1.1rem; }
  body .how-steps span { font-size: .9rem; }
  body section { padding-block: 24px; }
  body .section-head { margin-bottom: 12px; }
  body .section-head h2 { font-size: 1.6rem; }
}
/* Phone header: one line — flame + FLINT DIRECT | BOBCAT PARTNER; the email lives in the closing section and footer */
@media (max-width: 640px) {
  .site-head .wrap { gap: 12px; padding-block: 12px; }
  .site-head .help { display: none; }
  .partner { font-size: 1.05rem; padding-left: 12px; white-space: nowrap; }
  .site-head .wordmark { font-size: 1.05rem; white-space: nowrap; }
  .site-head .logo { height: 28px; }
}
.site-head .help svg { width: 18px; height: 18px; color: var(--accent); flex: none; }

/* Shared bits */
.eyebrow { font-size: .75rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.chip { display: inline-flex; align-items: center; font-size: .78rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-text); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.pill.open { background: var(--good-soft); color: var(--good); }
.pill.pre { background: var(--accent-soft); color: var(--accent-text); }
.pill.closed { background: var(--line); color: var(--muted); }
.pill.min { background: var(--neutral-soft); color: var(--ink); }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 8px 16px; font-weight: 600; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 85%, var(--on-accent)); }
.btn.added { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.link { background: none; border: 0; color: var(--accent-text); font-weight: 600; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
section { padding-block: 32px; }
.section-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.section-head p { color: var(--muted); }
.section-head h2 { text-transform: uppercase; letter-spacing: .04em; }

/* Campaign card */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.is-added { border-color: var(--good); box-shadow: inset 0 0 0 1px var(--good); }
.card-top { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; margin-bottom: -4px; }
.ch-tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: flex-start; align-content: flex-start; }
/* Channel tags: one soft cyan style; the icon and label tell channels apart */
.ch { display: inline-flex; align-items: center; gap: 5px; font-size: .78rem; font-weight: 700; padding: 3px 10px 3px 8px; border-radius: 999px; color: var(--accent-text); background: var(--accent-soft); }
.ch svg { width: 14px; height: 14px; flex: none; }
.card h3 { font-size: 1.85rem; }
.card h3 { text-transform: uppercase; letter-spacing: .02em; } /* titles stay in caps; details read in normal case */
.grid > .card p.blurb, .feature-card p.blurb { text-transform: none; letter-spacing: 0; font-size: .95rem; }
/* Line up each tile's parts (title, tags, text, price, rows, buttons) across a grid row */
@supports (grid-template-rows: subgrid) {
  .grid > .card { display: grid; grid-row: span 6; grid-template-rows: subgrid; row-gap: 12px; align-content: start; }
  .grid > .card.no-tags { grid-row: span 5; }
}
.card p.blurb { color: var(--muted); font-size: .95rem; line-height: 1.45; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
.price-band { display: flex; align-items: center; justify-content: space-between; gap: 12px; border-block: 1px solid var(--line); padding-block: 12px; flex-wrap: wrap; }
.price-big { font-family: var(--display); font-size: 2.2rem; font-weight: 700; line-height: 1; }
.price-unit { font-size: .85rem; color: var(--muted); margin-top: 2px; }
.coop { font-size: .78rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--good-soft); color: var(--good); white-space: nowrap; }
.coop-math { display: flex; justify-content: space-between; gap: 12px; background: var(--good-soft); color: var(--good); border-radius: 8px; padding: 10px 14px; font-weight: 600; flex-wrap: wrap; }
.rows { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; font-size: .92rem; }
.rows dt { color: var(--muted); }
.rows dd { margin: 0; }
.card .rows dd { font-weight: 400; color: var(--ink); } /* every value on a tile has the same weight; labels stay gray */
.goal { text-transform: uppercase; font-weight: 700; letter-spacing: .04em; }
.price { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.price strong { font-family: var(--display); font-size: 1.8rem; }
.price span { color: var(--muted); font-size: .9rem; }
.meta { font-size: .88rem; color: var(--muted); }
.meta b { color: var(--ink); }
.badges { display: flex; gap: 6px; flex-wrap: wrap; }
.card-actions { display: flex; gap: 8px; margin-top: auto; padding-top: 4px; }
.card-actions .btn { flex: 1; }
.proof { font-size: .85rem; border-top: 1px dashed var(--line); padding-top: 10px; color: var(--muted); }
.proof b { color: var(--ink); font-family: var(--display); font-size: 1.1rem; }

/* Results strip */
.results { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.result { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; text-align: left; color: var(--ink); display: flex; flex-direction: column; gap: 6px; }
.result:hover { border-color: var(--accent); }
.result .big { font-family: var(--display); font-size: 3rem; line-height: 1; color: var(--accent); }
.result .unit { font-weight: 600; }
.result .who { color: var(--muted); font-size: .88rem; }
.program-band { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 20px 24px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 12px; }
.program-label { font-size: .78rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.program-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.program-stats div { display: flex; flex-direction: column; gap: 2px; }
.program-stats b { font-family: var(--display); font-size: 2.6rem; line-height: 1; color: var(--accent); }
.program-stats span { font-size: .82rem; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; color: var(--muted); }
.program-stats div { border-top: 1px solid var(--line); padding-top: 8px; }
.featured { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 28px; align-items: center; background: var(--surface); border: 2px solid var(--partner); border-radius: 12px; padding: 24px 28px; margin-bottom: 16px; }
.featured-main { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.featured-main p { color: var(--muted); max-width: 60ch; }
.featured-big { font-family: var(--display); font-size: 4rem; font-weight: 700; line-height: 1; color: var(--accent); }
.featured-unit { font-family: var(--display); font-size: 1.5rem; font-weight: 700; text-transform: uppercase; }
.featured-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px; }
.featured-stats div { display: flex; flex-direction: column; border-top: 1px solid var(--line); padding-top: 8px; }
.featured-stats b { font-family: var(--display); font-size: 2rem; line-height: 1.05; }
.featured-stats span { font-size: .82rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
@media (max-width: 900px) { .featured { grid-template-columns: 1fr; } }
.result-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.result-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.result-label { font-family: var(--display); font-size: 1.5rem; font-weight: 700; text-transform: uppercase; color: var(--accent); }
.result .unit { font-weight: 400; color: var(--muted); }
.result-stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: .88rem; color: var(--muted); }
.result-stats b { color: var(--ink); }
@media (max-width: 900px) { .program-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.sample-tag { font-size: .72rem; color: var(--muted); font-style: italic; }

/* Layout A: storefront */
.hero { background: var(--surface); border-bottom: 1px solid var(--line); }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 32px; padding-block: 40px; align-items: center; }
.closer { background: var(--surface); border-top: 1px solid var(--line); }
.closer .wrap { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 32px; align-items: center; padding-block: 40px; }
.closer-title { font-size: 2.6rem; text-transform: uppercase; margin-top: 6px; }
.closer-actions { display: flex; flex-direction: column; gap: 10px; }
.closer-actions .btn { padding-block: 12px; font-size: 1rem; }
.closer-actions .hint { text-align: center; }
.closer .help-email { color: var(--sky); }
.site-foot { background: var(--band); color: var(--on-band); border-top: 1px solid var(--line); }
.site-foot .wrap { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 24px; padding-block: 28px; align-items: center; }
.site-foot .wordmark { color: var(--accent); }
.foot-brand { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.foot-partner { padding-left: 14px; border-left: 1px solid color-mix(in srgb, var(--on-band) 35%, transparent); line-height: 1; color: var(--on-band); font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: .95rem; }
.foot-partner b { color: var(--partner); }
.foot-links { display: flex; gap: 20px; font-size: .9rem; opacity: .85; flex-wrap: wrap; }
.foot-note { grid-column: 1 / -1; font-size: .78rem; opacity: .65; max-width: 90ch; }
@media (max-width: 900px) { .closer .wrap, .site-foot .wrap { grid-template-columns: 1fr; } }
.how { background: var(--how-bg); color: var(--ink); border-bottom: 1px solid var(--line); }
.how .wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; padding-block: 24px; }
.how-title { font-family: var(--display); font-size: 1.5rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--partner-text); }
.how-steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; counter-reset: step; }
/* Each step shares two rows with its neighbours, so every headline and every description starts on the same line */
.how-steps { grid-template-rows: auto auto; row-gap: 6px; }
.how-steps li { counter-increment: step; display: grid; grid-row: span 2; grid-template-rows: subgrid; grid-template-columns: 44px minmax(0, 1fr); column-gap: 12px; align-items: start; }
.how-steps li b { grid-column: 2; grid-row: 1; align-self: center; line-height: 1.15; }
.how-steps li span { grid-column: 2; grid-row: 2; line-height: 1.45; }
.how-steps li::before { content: counter(step); grid-column: 1; grid-row: 1; align-self: center; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--partner); color: var(--partner-text); background: var(--surface); display: grid; place-items: center; font-family: var(--display); font-size: 1.3rem; font-weight: 700; }
.how-steps b { font-family: var(--display); font-size: 1.15rem; text-transform: uppercase; letter-spacing: .04em; }
.how-steps span { font-size: .9rem; opacity: .8; }
@media (max-width: 900px) { .how .wrap, .how-steps { grid-template-columns: 1fr; } }
.hero-kicker { font-family: var(--display); font-size: 1.6rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--partner); line-height: 1.1; }
.hero p.lead { color: var(--muted); font-size: 1.15rem; margin-top: 12px; max-width: 52ch; }
.deadline-box { border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
.deadline-box { gap: 12px; padding: 24px; align-items: center; text-align: center; }
.deadline-box > div:last-child { width: 100%; }
.deadline-box .eyebrow { font-size: 1.05rem; color: var(--ink); }
.deadline-box .btn { flex: 1; padding-block: 10px; }
.timer { display: flex; align-items: flex-start; justify-content: space-between; width: 100%; color: var(--accent); }
.timer .unit { flex: 1; display: flex; flex-direction: column; align-items: center; }
.timer b { font-family: var(--display); font-size: clamp(3rem, 5.2vw, 4.75rem); line-height: 1; }
.timer i { font-family: var(--display); font-style: normal; font-size: clamp(2.4rem, 4.2vw, 3.8rem); line-height: 1.1; opacity: .45; }
.timer small { font-size: .78rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.timer.urgent { color: var(--partner); }
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(280px, 1fr); gap: 16px; overflow-x: auto; padding-bottom: 6px; }
.grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.one { grid-template-columns: minmax(0, 1fr); }
/* Four tiles visible; any more scroll sideways */
.grid.scroll-row { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: calc((100% - 3 * 16px) / 4); overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 10px; }
.grid.scroll-row > .card { scroll-snap-align: start; }
.grid.scroll-row .rows { grid-template-columns: minmax(0, 1fr); gap: 0; }
.grid.scroll-row .rows dt { font-size: .75rem; letter-spacing: .06em; }
.grid.scroll-row .rows dd { margin-bottom: 6px; white-space: nowrap; }
.grid.scroll-row .card h3 { font-size: 1.6rem; }
.grid.scroll-row .card-actions .btn { padding-inline: 10px; white-space: nowrap; } /* keeps "Enroll now" on one line on the narrow seasonal cards */
@media (max-width: 900px) { .grid.scroll-row { grid-auto-columns: 80%; } }
/* Phone: Always-On becomes a swipeable row like Seasonal (one tile + the next peeking in) */
.swipe-hint { display: none; }
@media (max-width: 640px) {
  #always-on .grid { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 84%; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 10px; }
  #always-on .grid > .card { scroll-snap-align: start; }
  .grid.scroll-row { grid-auto-columns: 84%; }
  .swipe-hint { display: block; font-size: .8rem; color: var(--muted); margin-top: 6px; }
}
.feature-card { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 32px; padding: 28px; border: 2px solid var(--accent); }
.feature-card h3 { font-size: 2.6rem; }
.feature-card p.blurb { font-size: .95rem; letter-spacing: 0; -webkit-line-clamp: 3; line-clamp: 3; min-height: 0; }
.fc-main, .fc-side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.fc-flag { align-self: flex-start; }
.pill.fc-flag { background: color-mix(in srgb, var(--partner) 12%, var(--surface)); color: var(--partner-text); } /* deadline urgency = Bobcat orange, like the countdown */
.feature-card .price-band { border-top: 0; padding-top: 0; }
@media (max-width: 900px) { .feature-card { grid-template-columns: 1fr; } }
@media (max-width: 900px) { .grid.three, .grid.two { grid-template-columns: 1fr; } }
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.tabs button { border: 0; background: none; padding: 6px 18px; border-radius: 999px; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }

/* Layout B: catalog + sidebar */

.side { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.sel-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.sel-list li { display: flex; justify-content: space-between; gap: 8px; font-size: .95rem; }

/* Layout C: season calendar */
.cal { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; overflow-x: auto; }
.cal-inner { min-width: 860px; }

.cal-name { display: flex; flex-direction: column; gap: 2px; padding-right: 12px; }

.cal-track { position: relative; height: 64px; }
.cal-bar { position: absolute; top: 18px; height: 28px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--ink); font-size: .8rem; font-weight: 600; text-align: left; padding: 0 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-bar.closed { border-color: var(--line); background: var(--bg); color: var(--muted); }

.cal-dl { position: absolute; top: 25px; width: 14px; height: 14px; transform: translateX(-7px) rotate(45deg); background: var(--ink); }
.cal-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--partner); }
.cal-legend { display: flex; gap: 20px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); margin-top: 12px; }
.cal-legend span { display: inline-flex; align-items: center; gap: 6px; }
.key-dl { width: 10px; height: 10px; background: var(--ink); transform: rotate(45deg); display: inline-block; }
.key-today { width: 2px; height: 14px; background: var(--partner); display: inline-block; }
.menu { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.c-split { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 16px; }

/* Tray */
.tray { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -6px 20px rgba(0,0,0,.08); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 20; }
.tray-bar { display: flex; align-items: center; gap: 24px; padding-block: 14px; flex-wrap: wrap; }

.tray .sums { display: flex; gap: 24px; color: var(--muted); flex-wrap: wrap; }
.tray .sums b { color: var(--ink); }
.tray-actions { margin-left: auto; display: flex; gap: 8px; }
.t-short { display: none; }
/* Phone: two-line bar — count over subtotals on the left, a tall Enroll button on the right */
@media (max-width: 640px) {
  .tray-bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; row-gap: 2px; padding-block: 10px; }
  .tray .count { grid-column: 1; grid-row: 1; font-size: .95rem; }
  .tray .sums { grid-column: 1; grid-row: 2; gap: 4px 12px; font-size: .8rem; }

}
.tray-panel { border-bottom: 1px solid var(--line); max-height: 62vh; overflow-y: auto; background: var(--bg); }
.tray-panel-inner { display: flex; flex-direction: column; gap: 14px; padding-block: 20px; }
.opt-empty { padding: 10px 14px; color: var(--muted); font-size: .92rem; }
.tray-panel-head { display: flex; justify-content: space-between; align-items: center; }
.tray-panel-head .remove { border: 0; background: none; color: var(--muted); font-size: 1.1rem; }
.tray-dealer { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.tray-dealer .field { flex: 1; min-width: 240px; }
.tray-dealer .options { max-height: 220px; overflow-y: auto; }
.tray-row { display: grid; grid-template-columns: minmax(180px, 240px) minmax(0, 1fr) 140px 32px; gap: 16px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
.tray-row .name b { font-family: var(--display); font-size: 1.2rem; display: block; }

.loc-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.loc-chip { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: .9rem; cursor: pointer; background: var(--surface); }

@media (max-width: 900px) { .tray-row { grid-template-columns: 1fr auto; } .tray-row .loc-chips { grid-column: 1 / -1; } }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 30; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); z-index: 31; display: flex; flex-direction: column; box-shadow: var(--shadow); }

.demo { aspect-ratio: 16 / 9; max-width: 100%; border: 1px dashed var(--line); border-radius: 10px; background: repeating-linear-gradient(45deg, var(--bg), var(--bg) 10px, var(--surface) 10px, var(--surface) 20px); display: grid; place-items: center; text-align: center; color: var(--muted); padding: 16px; font-size: .9rem; }

.statrow { display: flex; gap: 20px; flex-wrap: wrap; font-size: .9rem; color: var(--muted); }
.statrow b { color: var(--ink); }
details { border-bottom: 1px solid var(--line); padding-block: 8px; }
summary { font-weight: 600; cursor: pointer; }
details p { color: var(--muted); margin-top: 6px; }

/* Campaign detail window */
.dmodal { position: fixed; inset: 0; display: grid; place-items: center; z-index: 31; padding: 24px; }
.dmodal-card { position: relative; z-index: 1; background: var(--surface); border-radius: 14px; width: min(1080px, 100%); max-height: calc(100vh - 48px); display: flex; flex-direction: column; box-shadow: var(--shadow); overflow: hidden; }

.dm-lead { color: var(--muted); font-size: 1rem; max-width: 70ch; }
/* The demo always fills the column width; if the text below it doesn't fit, the window body scrolls */
.dm-body { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; padding: 20px 32px 24px; overflow-y: auto; align-items: start; min-height: 0; }
.dm-main { display: flex; flex-direction: column; gap: 18px; min-width: 0; }

/* Campaign animation (demos/*.html): 16:9, width set by fitDemo() */
.dm-demo { aspect-ratio: 16 / 9; width: 100%; height: auto; align-self: flex-start; max-width: 100%; border: 0; border-radius: 10px; display: block; background: #1a1a1a; }
/* Phone: Details becomes a full-screen page that scrolls, with a sticky Enroll now button.
   Order: name/tags → demo → price + co-op → goal/dates → What it is / What's included → FAQ */
@media (max-width: 640px) {

  body .dmodal .dm-head { padding: 18px 18px 12px; padding-top: calc(18px + env(safe-area-inset-top, 0px)); }
  body .dmodal .dm-title { font-size: 2rem; padding-right: 40px; }

  body .dmodal .dm-main, body .dmodal .dm-side { display: contents; }
  body .dmodal .dm-demo, body .dmodal .dm-video { order: 1; height: auto; aspect-ratio: 16 / 9; width: 100%; }
  body .dmodal .dm-side .price-band { order: 2; border-top: 1px solid var(--line); padding-top: 12px; }

  body .dmodal .cs-cta .btn { width: 100%; padding-block: 12px; }
  body .dmodal .dm-cta { order: 8; position: sticky; bottom: 0; width: calc(100% + 36px); margin: 4px -18px 0; border-radius: 0; padding-block: 16px calc(16px + env(safe-area-inset-bottom, 0px)); font-size: 1.05rem; box-shadow: 0 -6px 16px rgba(0,0,0,.12); }
}
.cs-card { width: min(720px, 100%); }
.cs-body { padding: 20px 32px 28px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
.cs-hero { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.cs-quote { margin: 0; padding: 12px 16px; border-left: 3px solid var(--partner); background: var(--bg); font-style: italic; }
.cs-cta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 16px; }
.cs-cta .hint { margin-right: auto; }
/* Shorter laptop screens (e.g. 1366 × 768): tighten everything so the window still fits without scrolling */
@media (max-height: 860px) {
  .dmodal { padding: 16px; }
  .dmodal-card { max-height: calc(100vh - 32px); }
  .dm-head { padding: 16px 28px 12px; gap: 6px; }

  .dm-lead { font-size: .92rem; }
  .dm-body { padding: 14px 28px 18px; gap: 24px; }
  .dm-main { gap: 12px; }

  .dm-side .coop-math { padding: 8px 12px; }
}
.dm-two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; font-size: .95rem; }
.dm-two ul { margin: 0; padding-left: 18px; }
.dm-side { display: flex; flex-direction: column; gap: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
.dm-side .price-band { border-top: 0; padding-top: 0; }
.dm-side .btn { width: 100%; padding-block: 11px; }

.dm-faq details { padding-block: 6px; font-size: .9rem; }

@media (max-width: 900px), (max-height: 640px) { .dm-body { overflow-y: auto; } }
@media (max-width: 900px) { .dm-body, .dm-two { grid-template-columns: 1fr; } }

}

/* Checkout page (full screen) */
.checkout-page { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; padding-bottom: env(safe-area-inset-bottom, 0px); }
.co-topbar { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }

/* Phone confirmation screen: full screen like Details and checkout */
@media (max-width: 640px) {
  body .modal { padding: 0; place-items: stretch; }
  body .modal .modal-card { width: 100%; height: 100vh; height: 100dvh; max-height: none; border-radius: 0; }
  body .modal .modal-body { padding: 18px 16px; padding-top: calc(18px + env(safe-area-inset-top, 0px)); }

}
/* Phone checkout: slim total bar at the top (tap to expand), full summary at the bottom, sticky Submit */

@media (max-width: 640px) {
  .co-topbar .wrap { padding-block: 10px; }

  .co-sticky { display: flex; flex-direction: column; gap: 6px; position: sticky; bottom: 0; z-index: 2; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -6px 16px rgba(0,0,0,.1); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
  .co-sticky .btn { width: 100%; padding-block: 14px; font-size: 1.05rem; }
  .co-sticky .err { margin: 0; }
}
/* Checkout */
.co-head { padding: 24px 32px 0; display: flex; flex-direction: column; gap: 4px; }
.co-head h2 { text-transform: uppercase; }
.co-body { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 28px; padding: 20px 32px 28px; overflow-y: auto; align-items: start; }
.co-h { font-size: 1.2rem; text-transform: uppercase; letter-spacing: .04em; }
.co-form { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

@media (max-width: 900px) { .co-body { grid-template-columns: 1fr; } }

/* Modal */
.modal { position: fixed; inset: 0; display: grid; place-items: center; z-index: 40; padding: 16px; }
.modal-card { background: var(--surface); border-radius: 12px; width: min(760px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; box-shadow: var(--shadow); position: relative; z-index: 1; }
.modal-card.wide { width: min(1080px, 100%); }

.flag { font-size: .72rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; }
.flag.dup { background: var(--warn-soft); color: var(--warn); }
.flag.other { background: var(--neutral-soft); color: var(--ink); }
.flag.new { background: var(--good-soft); color: var(--good); }
.flag.pre { background: var(--accent-soft); color: var(--accent-text); }
.checklist { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
.checklist li::before { content: "\2610  "; }
.lead-block { display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--line); padding-top: 10px; }
.lead-campaigns { margin: 4px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.email-checklists { display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; background: var(--bg); }
.email-check { border-top: 1px solid var(--line); padding-top: 8px; }
.success { display: flex; flex-direction: column; gap: 6px; }
.thanks-card { width: min(520px, 100%); }
.thanks { align-items: center; text-align: center; gap: 12px; padding-block: 32px 24px; }
.thanks h2 { font-size: 2rem; text-transform: uppercase; letter-spacing: .02em; }
.thanks p { max-width: 42ch; }
.thanks .help-email { color: var(--accent-text); }
.thanks-check { width: 56px; height: 56px; border-radius: 50%; background: var(--good-soft); color: var(--good); display: grid; place-items: center; }
.thanks-check svg { width: 28px; height: 28px; }
.thanks-card .modal-foot .btn.primary { margin: 0 auto; }
.toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 8px; z-index: 50; font-weight: 600; }

@media (max-width: 900px) {
  .hero .wrap, .cat, .c-split, .emails { grid-template-columns: 1fr; }
  .results, .menu { grid-template-columns: 1fr; }
  .side { position: static; }
  h1 { font-size: 2.3rem; }
  .wrap { padding-inline: 16px; }
  .review .note { margin-left: 0; }
}
@media (prefers-reduced-motion: no-preference) {
  .drawer { animation: slide .18s ease-out; }
  @keyframes slide { from { transform: translateX(24px); opacity: .6; } to { transform: none; opacity: 1; } }
}

        ${seasonal().map(c => {
          const st = status(c);
          return `<div class="cal-row">
            <div class="cal-name"><b>${esc(c.name)}</b><span class="hint num">${money(c.price)} / location</span><span>${st === 'always' ? '' : `<span class="pill ${st}" style="font-size:.7rem">${STATUS_LABEL[st]}</span>`}</span></div>

              <span class="cal-today" style="left:${todayPct}"></span>

// ---------- Tray ----------
// The bar expands to pick the dealership once, then which locations run each campaign.
const enr = { q: '', dealer: null, manual: false, manualName: '', manualLocs: [{ city: '', st: '' }], campLocs: {}, err: '' };
function allLocs() {
  if (enr.manual) return enr.manualLocs.filter(l => l.city.trim()).map(l => `${l.city.trim()}${l.st.trim() ? ', ' + l.st.trim().toUpperCase() : ''}`);
  return enr.dealer ? enr.dealer.locs : [];
}
function dealerName() { return enr.manual ? enr.manualName.trim() : enr.dealer && enr.dealer.name; }
const hasDealer = () => !!dealerName() && allLocs().length > 0;
function ensureLocs(reset = false) {
  state.sel.forEach(id => { if (reset || !enr.campLocs[id]) enr.campLocs[id] = new Set(allLocs()); });
}
const locsFor = id => allLocs().filter(l => enr.campLocs[id] && enr.campLocs[id].has(l));
function lines() {
  return [...state.sel].map(byId).map(c => { const locs = locsFor(c.id); return { c, locs, n: locs.length, total: c.price * locs.length }; });
}
function totals() {
  const L = lines();
  return { mo: L.filter(x => x.c.type === 'always').reduce((s, x) => s + x.total, 0), one: L.filter(x => x.c.type !== 'always').reduce((s, x) => s + x.total, 0) };
}
const usedLocs = () => [...new Set(lines().flatMap(x => x.locs))];
// Privacy: no dealer names show until 3+ characters are typed, and only names that START with what was typed
// (so a common word like "Equipment" never lists other dealers).
const MIN_CHARS = 3, MAX_RESULTS = 5;
function dealerMatches(raw) {
  const q = raw.trim().toLowerCase();
  if (q.length < MIN_CHARS) return null;
  return DEALERS.filter(x => x.name.toLowerCase().startsWith(q)).slice(0, MAX_RESULTS);
}
function dealerOpts(hits) {
  if (!hits) return '';
  if (!hits.length) return `<div class="opt-empty">No dealership found. Check the spelling, or choose "My dealership isn't listed" below.</div>`;
  return hits.map(x => `<button type="button" data-act="pickdealer" data-name="${esc(x.name)}"><span>${esc(x.name)}</span><small>${x.locs.length} location${x.locs.length > 1 ? 's' : ''}</small></button>`).join('');
}
function dealerBlock() {
  if (enr.dealer) return `<div class="tray-dealer"><span class="eyebrow">Dealership</span><b style="font-size:1.1rem">${esc(enr.dealer.name)}</b><span class="hint">${enr.dealer.locs.length} location${enr.dealer.locs.length > 1 ? 's' : ''}</span><button type="button" class="link" data-act="changedealer">Change</button></div>`;
  if (enr.manual) return `<div class="tray-dealer" style="align-items:flex-start">
      <div class="field"><label for="manual-name">Dealership name</label><input id="manual-name" value="${esc(enr.manualName)}" placeholder="Valley Equipment"></div>
      <div class="manual-locs"><label style="font-weight:600;font-size:.9rem">Locations (city, state)</label>
        ${enr.manualLocs.map((l, i) => `<div class="row2"><input aria-label="City ${i + 1}" data-loc="${i}" data-k="city" value="${esc(l.city)}" placeholder="City" class="field-input"><input aria-label="State ${i + 1}" data-loc="${i}" data-k="st" value="${esc(l.st)}" maxlength="2" placeholder="ST" class="field-input"></div>`).join('')}
        <button type="button" class="link" data-act="addloc" style="align-self:start">+ Add another location</button></div>
      <button type="button" class="link" data-act="changedealer" style="margin-top:28px">Search the list instead</button></div>`;
  const hits = dealerMatches(enr.q);
  return `<div class="tray-dealer" style="flex-direction:column;align-items:stretch">
      <div class="field"><label for="dealer-q">Find your dealership</label><input id="dealer-q" type="search" placeholder="Type at least 3 letters of your dealership name" value="${esc(enr.q)}" autocomplete="off"></div>
      <div class="options" id="dealer-opts" ${hits ? '' : 'hidden'}>${dealerOpts(hits)}</div>
      <button type="button" class="link" data-act="manual" style="align-self:start">My dealership isn't listed</button>
      ${isSketch() ? `<p class="hint">Sample dealers. Try Smith Equipment with Paid Social at Dayton to see the duplicate flag.</p>` : ''}</div>`;
}
function trayRow(c) {
  const locs = locsFor(c.id), all = allLocs();
  const chips = hasDealer()
    ? `<div class="loc-chips">${all.map(l => `<label class="loc-chip"><input type="checkbox" data-cl="${c.id}" data-l="${esc(l)}" ${locs.includes(l) ? 'checked' : ''}>${esc(l)}</label>`).join('')}</div>`
    : `<span class="hint">Pick your dealership to choose locations</span>`;
  const total = hasDealer() ? `${money(c.price * locs.length)}${c.type === 'always' ? '/mo' : ''}` : `${money(c.price)}${c.type === 'always' ? '/mo' : ''} / location`;
  return `<div class="tray-row">
    <div class="name"><b>${esc(c.name)}</b><span class="hint">${c.type === 'always' ? 'Monthly' : 'One-time'}${c.min ? ` · ${c.min}-month minimum` : ''}</span></div>
    ${chips}
    <div class="line-total num">${total}</div>
    <button type="button" class="remove" data-act="toggle" data-id="${c.id}" aria-label="Remove ${esc(c.name)}">✕</button>
  </div>`;
}
function renderTray() {
  const tray = $('#tray');
  if (!state.sel.size || state.modal) { tray.hidden = true; return; }
  tray.hidden = false;
  const { monthly, once } = sums(), t = totals(), known = hasDealer();
  const parts = known
    ? [t.mo && `<span>Monthly <b class="num">${money(t.mo)}/mo</b></span>`, t.one && `<span>One-time <b class="num">${money(t.one)}</b></span>`]
    : [monthly && `<span>Monthly <b class="num">${money(monthly)}</b> / location</span>`, once && `<span>One-time <b class="num">${money(once)}</b> / location</span>`];
  const sumsHTML = parts.filter(Boolean).join('');
  tray.innerHTML = `${state.trayOpen ? `<div class="tray-panel"><div class="wrap tray-panel-inner">
      <div class="tray-panel-head"><h3 class="co-h">Choose your locations</h3><button type="button" class="remove" data-act="traytoggle" aria-label="Close locations panel">✕</button></div>
      ${dealerBlock()}
      ${[...state.sel].map(byId).map(trayRow).join('')}
      ${enr.err ? `<p class="err" role="alert">${esc(enr.err)}</p>` : ''}
    </div></div>` : ''}
    <div class="wrap tray-bar">
      <span class="count">${state.sel.size} campaign${state.sel.size > 1 ? 's' : ''} selected</span>
      <span class="sums">${sumsHTML}</span>
      <span class="tray-actions">
        <button type="button" class="btn primary" data-act="continue"><span class="t-long">Choose locations &amp; enroll</span><span class="t-short">Enroll</span></button>
      </span>
    </div>`;
}
function trayError() {
  if (!dealerName()) return 'Find your dealership first, or choose "My dealership isn\'t listed".';
  if (!allLocs().length) return 'Add at least one location for your dealership.';
  const empty = lines().filter(x => !x.n).map(x => x.c.name);
  if (empty.length) return `Choose at least one location for ${empty.join(', ')}, or remove it.`;
  return '';
}

// ---------- Drawer ----------
function renderDrawer() {
  const root = $('#drawer-root');
  if (!state.drawer) { root.innerHTML = ''; return; }

  if (kind === 'case') {
    const cs = CASES[id];
    const linked = CAMPAIGNS.filter(c => c.cs === id);
    // Same centered window style as the campaign details, sized down for a single result.
    root.innerHTML = `<div class="dmodal"><div class="scrim" style="z-index:0" data-act="close"></div>
    <div class="dmodal-card cs-card" role="dialog" aria-label="Case study: ${esc(cs.label)}">
      <button type="button" class="close" data-act="close" aria-label="Close">✕</button>
      <div class="dm-head">
        <div class="eyebrow">Case study · ${esc(cs.profile)}</div>
        <div class="result-chips">${cs.chips.map(x => `<span class="chip">${esc(x)}</span>`).join('')}</div>
      </div>
      <div class="cs-body">
        <div class="cs-hero"><span class="featured-big num">${cs.big}</span> <span class="featured-unit">${esc(cs.label)}</span></div>
        <p class="dm-lead">${esc(cs.context)}</p>
        <div class="featured-stats">${cs.stats.map(([v, l]) => `<div><b class="num">${v}</b><span>${esc(l)}</span></div>`).join('')}</div>
        <div class="dsec"><h4>What we ran</h4><p>${esc(cs.focus)}</p></div>
        ${cs.quote ? `<blockquote class="cs-quote">${esc(cs.quote)}</blockquote>` : ''}
        ${linked.length ? `<div class="cs-cta"><span class="hint">Run a similar campaign</span>${linked.map(c => `<button type="button" class="btn" data-act="detail" data-id="${c.id}">${esc(c.name)} details</button>${addBtn(c)}`).join('')}</div>` : ''}
      </div>
    </div></div>`;
    return;
  }
  const c = byId(id), cs = c.cs && CASES[c.cs];
  const cancel = c.type === 'always'
    ? (c.min ? `${c.min}-month minimum, then cancel anytime` : 'Cancel anytime')
    : `Free until launch on ${short(c.start)}`;
  // Already open for this campaign (e.g. after "Enroll now"): swap only the button so the animation keeps playing
  const open = root.querySelector(`.dmodal-card[data-cid="${c.id}"] .dm-cta`);
  if (open) { open.outerHTML = addBtn(c, 'dm-cta'); return; }
  root.innerHTML = `<div class="dmodal"><div class="scrim" style="z-index:0" data-act="close"></div>
  <div class="dmodal-card" role="dialog" aria-label="${esc(c.name)} details" data-cid="${c.id}">
    <button type="button" class="close" data-act="close" aria-label="Close">✕</button>
    <div class="dm-head">
      <div class="eyebrow">${c.type === 'always' ? 'Always-On campaign' : 'Seasonal campaign'}</div>
      <h2 class="dm-title">${esc(c.name)}</h2>
      ${tagsHTML(c)}
      <p class="dm-lead">${esc(c.blurb)}</p>
    </div>
    <div class="dm-body">
      <div class="dm-main">
        ${c.demo
          ? `<iframe class="dm-demo" allow="fullscreen" allowfullscreen src="demos/${c.demo}${demoParams(c)}" title="${esc(c.name)}: see it in action" loading="lazy"></iframe>`
          : `<div class="demo dm-video">Video goes here: how this campaign shows up and brings in leads.<br>Interactive demo planned for version 2.</div>`}
        <div class="dm-two">
          <div class="dsec"><h4>What it is</h4><p>${esc(c.what)}</p></div>
          <div class="dsec"><h4>What's included</h4><ul>${c.included.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
        </div>
      </div>
      <aside class="dm-side">
        ${priceBand(c)}
        <div class="coop-math"><span>Est. after ${Math.round(COOP * 100)}% co-op</span><span class="num">${money(Math.round(c.price * (1 - COOP)))}${c.type === 'always' ? '/mo' : ''}</span></div>
        <p class="hint">Per location. Co-op reimbursement depends on your available Bobcat co-op funds and claim approval. We'll help you file.</p>
        <dl class="rows">
          ${c.type === 'always'
            ? `<dt>Goal</dt><dd>${GOALS[c.id] || ''}</dd>`
            : `<dt>Goal</dt><dd>${GOALS[c.id] || ''}</dd><dt>Timeframe</dt><dd>${short(c.start)} – ${short(c.end)}</dd><dt>Enrollment deadline</dt><dd>${short(c.deadline)}</dd>`}
          <dt>${c.type === 'always' ? 'Commitment' : 'Cancel'}</dt><dd>${cancel}</dd>
        </dl>
        ${addBtn(c, 'dm-cta')}
        ${c.faq.length ? `<div class="dm-faq">${c.faq.map(([q, a]) => `<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('')}</div>` : ''}
      </aside>
    </div>
  </div></div>`;
  fitDemo();
}

// Campaign animation fills the column width, shrinking (still 16:9) only as much as needed so the window doesn't scroll
function fitDemo() {
  const f = document.querySelector('.dm-demo');
  if (!f) return;
  const body = f.closest('.dm-body');
  f.style.width = '100%';
  if (matchMedia('(max-width: 640px)').matches) return; // phones scroll the full-screen page, so the demo stays full width
  // (No longer shrinks the demo to avoid scrolling: a narrower demo left empty space beside it.)
}
addEventListener('resize', fitDemo);

// One checkout screen: your info on the left, order summary + pricing acknowledgment on the right.
const STEPS = [['checkout', 'Checkout']];
function openModal() {
  state.drawer = null;

  const prev = state.draft || { contact: { first: '', last: '', title: '', email: '', phone: '' }, notes: '' };
  state.modal = { step: 'checkout', contact: prev.contact, notes: prev.notes, ack: false, err: '' };
  render();
}
const locList = locs => locs.map(esc).join('; ');
function ackItems() {
  return lines().map(({ c, n, total }) => {
    if (c.type === 'always') return `${c.name} bills ${money(c.price)} per location each month (${n} location${n > 1 ? 's' : ''} = ${money(total)}/month)${c.min ? `, with a ${c.min}-month minimum` : ', cancel any time'}.`;
    if (status(c) === 'pre') return `${c.name} is a one-time charge of ${money(total)}. I can cancel free of charge before it launches on ${short(c.start)}.`;
    return `${c.name} is a one-time charge of ${money(total)}.`;
  });
}
function flagsFor() {
  const out = [], name = dealerName(), locs = usedLocs();
  if (enr.manual) out.push(['new', 'New dealer · not on list']);
  const dup = RECORD.filter(r => r.dealer === name && state.sel.has(r.campaign) && locsFor(r.campaign).includes(r.loc));
  dup.forEach(r => out.push(['dup', `Possible duplicate · ${r.loc} already in ${byId(r.campaign).name}`]));
  const other = RECORD.filter(r => r.dealer === name && !locs.includes(r.loc));
  other.forEach(r => out.push(['other', `Other location enrolled · ${r.loc} in ${byId(r.campaign).name}`]));
  [...state.sel].map(byId).filter(c => status(c) === 'pre').forEach(c => out.push(['pre', `Pre-enroll · ${c.name} launches ${short(c.start)}`]));
  return out;
}
function infoForm() {
  const m = state.modal, c = m.contact;
  const f = (k, label, type = 'text', ph = '') => `<div class="field"><label for="c-${k}">${label}</label><input id="c-${k}" type="${type}" data-c="${k}" value="${esc(c[k])}" placeholder="${ph}" autocomplete="${{ first: 'given-name', last: 'family-name', title: 'organization-title', email: 'email', phone: 'tel' }[k]}"></div>`;
  return `<div class="co-form">
    <div class="row2">${f('first', 'First name')}${f('last', 'Last name')}</div>
    ${f('title', 'Title', 'text', 'GM, Marketing Manager, Owner')}
    <div class="row2">${f('email', 'Email', 'email', 'name@dealership.com')}${f('phone', 'Phone', 'tel')}</div>
    <div class="field"><label for="c-notes">Anything we should know? (optional)</label><textarea id="c-notes" rows="3" placeholder="Current offers, timing, questions">${esc(m.notes)}</textarea></div>
  </div>`;
}
function orderSummary() {
  const m = state.modal, L = lines(), { mo, one } = totals(), known = hasDealer();
  if (!known) return `<aside class="co-summary">
    <div class="co-sum-head"><h3 class="co-h">Order summary</h3><button type="button" class="link" data-act="mclose">Add more campaigns</button></div>
    <ul class="co-lines">${L.map(({ c }) => `<li><div class="co-line-top"><b>${esc(c.name)}</b><span class="num">${money(c.price)}${c.type === 'always' ? '/mo' : ''}</span></div><div class="hint">per location</div></li>`).join('')}</ul>
    <p class="hint">Find your dealership to see your totals.</p>
    ${m.err ? `<p class="err" role="alert">${esc(m.err)}</p>` : ''}
    <button type="button" class="btn primary co-submit" data-act="next">Submit enrollment</button>
    ${privacyNote()}
  </aside>`;
  return `<aside class="co-summary">
    <div class="co-sum-head"><h3 class="co-h">Order summary</h3><button type="button" class="link" data-act="mclose">Add more campaigns</button></div>
    <div class="co-dealer">${esc(dealerName())}</div>
    <ul class="co-lines">${L.map(({ c, locs, total }) => `<li>
      <div class="co-line-top"><b>${esc(c.name)}</b><span class="num">${money(total)}${c.type === 'always' ? '/mo' : ''}</span></div>
      <div class="hint">${locs.length ? `${locs.length} location${locs.length > 1 ? 's' : ''}: ${locList(locs)}` : 'No locations selected'}</div>
      <div class="hint">${c.type === 'always' ? `Monthly · ${c.min ? `${c.min}-month minimum` : 'cancel anytime'}` : `One-time · launches ${short(c.start)}, cancel free until then`}</div>
    </li>`).join('')}</ul>
    <div class="co-totals">
      ${mo ? `<div><span>Monthly total</span><b class="num">${money(mo)}/mo</b></div>` : ''}
      ${one ? `<div><span>One-time total</span><b class="num">${money(one)}</b></div>` : ''}
      <div class="co-coop"><span>Est. after 75% co-op</span><span class="num">${[mo && `${money(Math.round(mo * (1 - COOP)))}/mo`, one && money(Math.round(one * (1 - COOP)))].filter(Boolean).join(' + ')}</span></div>
    </div>
    <label class="ack"><input id="ack" type="checkbox" ${m.ack ? 'checked' : ''}><span><b>I understand the pricing for my selections</b><ul>${ackItems().map(t => `<li>${esc(t)}</li>`).join('')}</ul></span></label>
    ${m.err ? `<p class="err" role="alert">${esc(m.err)}</p>` : ''}
    <button type="button" class="btn primary co-submit" data-act="next">Submit enrollment</button>
    ${privacyNote()}
  </aside>`;
}
// Phone only: a slim, tappable total under the checkout top bar (the full summary sits at the bottom of the page)
function miniSummary() {
  const L = lines(), known = hasDealer(), { mo, one } = totals(), s = sums();
  const amount = known
    ? [mo && `${money(mo)}/mo`, one && money(one)].filter(Boolean).join(' + ')
    : [s.monthly && `${money(s.monthly)}/mo`, s.once && money(s.once)].filter(Boolean).join(' + ') + ' per location';
  return `<div class="co-mini">
    <button type="button" class="co-mini-bar" data-act="minisum" aria-expanded="${!!state.miniOpen}">
      <span><b>${L.length} campaign${L.length > 1 ? 's' : ''}</b> · <span class="num">${amount}</span></span><span aria-hidden="true">${state.miniOpen ? '▲' : '▼'}</span>
    </button>
    ${state.miniOpen ? `<ul class="co-mini-list">${L.map(({ c, n, total }) => `<li><span>${esc(c.name)}${known ? ` · ${n} location${n === 1 ? '' : 's'}` : ''}</span><span class="num">${money(known ? total : c.price)}${c.type === 'always' ? '/mo' : ''}</span></li>`).join('')}</ul>` : ''}
  </div>`;
}
function refreshEnroll() { if (state.modal) { state.modal.err = ''; renderModal(); } else renderTray(); }
function validate() {
  const m = state.modal, c = m.contact;
  const locErr = trayError();
  if (locErr) return locErr;
  if (!c.first.trim() || !c.last.trim() || !c.title.trim() || !c.email.trim() || !c.phone.trim()) return 'Fill in your name, title, email and phone.';
  if (!/^\S+@\S+\.\S+$/.test(c.email.trim())) return 'Check the email address. It should look like name@dealership.com.';
  if (!m.ack) return 'Tick the box to confirm you understand the pricing.';
  return '';
}
function thanksView() {
  const m = state.modal, c = m.contact, names = lines().map(x => x.c.name);
  return `<div class="modal-body thanks">
    <div class="thanks-check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2>Thanks${c.first.trim() ? ', ' + esc(c.first.trim()) : ''}! You're enrolled.</h2>
    <p>${esc(dealerName())} is signed up for ${esc(names.join(', ').replace(/, ([^,]*)$/, ' and $1'))}.</p>
    <p>We've sent a confirmation and a short checklist to <b>${esc(c.email)}</b>. Our team will reach out shortly to kick things off.</p>
    <p class="hint">Questions? Email <b class="help-email">bobcat@flint-group.com</b></p>
  </div>`;
}
function renderModal() {
  const root = $('#modal-root'), m = state.modal;
  if (!m) { root.innerHTML = ''; return; }
  if (m.step === 'done') {
    root.innerHTML = `<div class="modal"><div class="scrim" style="z-index:0"></div><div class="modal-card thanks-card" role="dialog" aria-label="Enrollment submitted">
      ${thanksView()}
      <div class="modal-foot"><button type="button" class="btn primary" data-act="finish">Back to campaigns</button></div></div></div>`;
    return;
  }
  // Full checkout page: keep the dealer's scroll position across re-renders (ticking a location, picking a dealer).
  const prevScroll = root.querySelector('.checkout-page')?.scrollTop || 0;
  root.innerHTML = `<div class="checkout-page" role="dialog" aria-label="Checkout">
    <div class="co-topbar"><div class="wrap">
      <button type="button" class="link" data-act="mclose">← Back to campaigns</button>
      <span class="brand"><img class="logo" src="${LOGO_SRC}" alt=""><span class="wordmark">FLINT DIRECT</span></span>
    </div></div>
    ${miniSummary()}
    <div class="wrap co-page">
      <div class="co-main">
        <div><div class="eyebrow">Almost done</div><h2 class="co-title">Finish your enrollment</h2></div>
        <section class="co-step"><h3 class="co-h"><span class="co-num">1</span>Your dealership</h3>${dealerBlock()}</section>
        <section class="co-step"><h3 class="co-h"><span class="co-num">2</span>Locations for each campaign</h3>
          <p class="hint">All locations start selected. Untick any store that shouldn't run a campaign.</p>
          ${[...state.sel].map(byId).map(trayRow).join('')}
        </section>
        <section class="co-step"><h3 class="co-h"><span class="co-num">3</span>Your info</h3>${infoForm()}</section>
      </div>
      ${orderSummary()}
    </div>
    <div class="co-sticky">
      ${m.err ? `<p class="err" role="alert">${esc(m.err)}</p>` : ''}
      <button type="button" class="btn primary" data-act="next">Submit enrollment</button>
      ${privacyNote()}
    </div>
  </div>`;
  root.querySelector('.checkout-page').scrollTop = prevScroll;
  if (m.sending) root.querySelectorAll('[data-act="next"]').forEach(b => { b.disabled = true; b.textContent = 'Sending…'; });
}

// ---------- Zapier ----------
// Each enrollment posts to a Zapier Catch Hook as flat form fields, plus ready-to-send email text.
const ZAPIER_HOOK = 'https://hooks.zapier.com/hooks/catch/18144812/45bbnbv/';
function enrollmentPayload() {
  const m = state.modal, c = m.contact, L = lines(), { mo, one } = totals();
  const keep = a => a.filter(v => v !== null).join('\n');
  const coop = [mo ? `${money(Math.round(mo * (1 - COOP)))}/mo` : null, one ? money(Math.round(one * (1 - COOP))) : null].filter(Boolean).join(' + ');
  const campaigns = L.map(({ c: k, locs, total }) => `${k.name}: ${money(total)}${k.type === 'always' ? '/mo' : ' one-time'}${k.min ? ` (${k.min}-month minimum)` : ''}${k.type !== 'always' ? `, launches ${short(k.start)}` : ''}\n  Locations: ${locs.join('; ')}`).join('\n');
  const totalsText = keep([mo ? `Monthly total: ${money(mo)}/mo` : null, one ? `One-time total: ${money(one)}` : null, `Est. after ${Math.round(COOP * 100)}% co-op: ${coop}`]);
  const flags = flagsFor().map(f => f[1]).join('\n');
  // One combined list across all campaigns, each item once (e.g. High-res logo)
  const checklist = [...new Set(L.flatMap(({ c: k }) => checklistFor(k)))].map(x => `- ${x}`).join('\n');
  const locsText = usedLocs().join('; ');
  const notes = m.notes.trim();
  const leadBody = keep([flags ? `FLAGS\n${flags}\n` : null, `Dealer: ${dealerName()}`, `Locations: ${locsText}`, '', `Contact: ${c.first} ${c.last}`, `Title: ${c.title}`, `Email: ${c.email}`, `Phone: ${c.phone}`, '', 'Campaigns', campaigns, '', totalsText, notes ? `\nNotes: ${notes}` : null]);
  const confirmBody = keep([`Hi ${c.first},`, '', `Thanks for enrolling ${dealerName()} (${locsText}). Here's what you signed up for:`, '', campaigns, '', totalsText, '', 'Your checklist', 'Send us these so we can get each campaign live:', '', checklist, '', "We'll reach out to you shortly to kick things off. Questions? Just reply to this email.", '', 'The Flint Group team']);
  return {
    submitted_at: new Date().toISOString(),
    dealer: dealerName(), dealer_on_list: enr.manual ? 'No' : 'Yes', locations: locsText,
    first_name: c.first, last_name: c.last, title: c.title, email: c.email, phone: c.phone, notes,
    campaigns: L.map(x => x.c.name).join(', '), campaign_details: campaigns,
    monthly_total: mo ? money(mo) : '', one_time_total: one ? money(one) : '', coop_estimate: coop,
    flags, checklist,
    lead_email_subject: `NEW ENROLLMENT: ${dealerName()}`, lead_email_body: leadBody,
    confirmation_email_subject: `You're enrolled: ${L.map(x => x.c.name).join(', ')}`, confirmation_email_body: confirmBody,
    page: location.href
  };
}
// Form-encoded and no-cors so the browser sends it without a preflight check.
function sendEnrollment() {
  return fetch(ZAPIER_HOOK, { method: 'POST', mode: 'no-cors', body: new URLSearchParams(enrollmentPayload()) });
}

// ---------- Render ----------
function render() {
  document.querySelectorAll('[data-layout]').forEach(b => b.setAttribute('aria-pressed', b.dataset.layout === state.layout));
  $('#view').innerHTML = state.layout === 'A' ? layoutA() : state.layout === 'B' ? layoutB() : layoutC();
  renderTray(); renderDrawer(); renderModal();
}
// Seasonal trailers get price and dates in the URL so their end card matches the campaign.
const demoParams = c => c.type !== 'seasonal' ? '' : '?' + new URLSearchParams({
  price: c.price, coop: Math.round(c.price * (1 - COOP)), start: short(c.start), end: short(c.end), deadline: short(c.deadline) });
function toast(t, ms = 2200) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, ms); }

document.addEventListener('click', e => {
  const lay = e.target.closest('[data-layout]');
  if (lay) { state.layout = lay.dataset.layout; try { localStorage.setItem('hub-layout', state.layout); } catch (er) {} render(); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const { act, id } = el.dataset, m = state.modal;
  if (act === 'toggle') {
    const adding = !state.sel.has(id);
    if (adding) state.sel.add(id); else { state.sel.delete(id); delete enr.campLocs[id]; }
    if (!state.sel.size) { state.trayOpen = false; if (state.modal && state.modal.step !== 'done') state.modal = null; }
    ensureLocs(); enr.err = ''; if (state.modal) state.modal.err = '';
    render();
    if (adding && !state.hinted) { state.hinted = true; toast('Added to your selections. Choose locations to finish enrolling.', 4000); }
  }
  else if (act === 'detail') { state.drawer = { kind: 'campaign', id }; render(); }
  else if (act === 'case') { state.drawer = { kind: 'case', id }; render(); }
  else if (act === 'close') { state.drawer = null; render(); }
  else if (act === 'notify') toast('Sketch: this would collect an email for next season.');
  else if (act === 'tabA') { state.tabA = id; render(); }
  else if (act === 'filterB') { state.filterB = id; render(); }
  else if (act === 'enroll') { if (state.sel.size) openModal(); }
  else if (act === 'jump') { const t = document.getElementById(id); if (t) t.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); }
  else if (act === 'traytoggle') { state.trayOpen = !state.trayOpen; renderTray(); }
  else if (act === 'continue') {
    if (state.sel.size) openModal();
  }
  else if (act === 'minisum') { state.miniOpen = !state.miniOpen; renderModal(); }
  else if (act === 'mclose') { if (m && m.step !== 'done') state.draft = { contact: m.contact, notes: m.notes }; state.modal = null; render(); }
  else if (act === 'pickdealer') { enr.dealer = DEALERS.find(x => x.name === el.dataset.name); enr.manual = false; ensureLocs(true); refreshEnroll(); }
  else if (act === 'manual') { enr.manual = true; enr.dealer = null; ensureLocs(true); refreshEnroll(); const f = $('#manual-name'); if (f) f.focus(); }
  else if (act === 'changedealer') { enr.dealer = null; enr.manual = false; enr.q = ''; enr.campLocs = {}; refreshEnroll(); }
  else if (act === 'addloc') { enr.manualLocs.push({ city: '', st: '' }); refreshEnroll(); }
  else if (act === 'back') { m.err = ''; m.step = STEPS[STEPS.findIndex(s => s[0] === m.step) - 1][0]; renderModal(); }
  else if (act === 'next') {
    if (m.sending) return;
    m.err = validate();
    if (m.err) { renderModal(); return; }
    m.sending = true; renderModal();
    sendEnrollment()
      .then(() => { m.sending = false; m.step = 'done'; renderModal(); })
      .catch(() => { m.sending = false; m.err = "We couldn't send your enrollment. Check your connection and try again, or email bobcat@flint-group.com."; renderModal(); });
  }
  else if (act === 'finish') { state.modal = null; state.draft = null; state.sel.clear(); state.trayOpen = false; Object.assign(enr, { q: '', dealer: null, manual: false, manualName: '', manualLocs: [{ city: '', st: '' }], campLocs: {}, err: '' }); render(); toast('Enrollment sent.'); }
});
document.addEventListener('input', e => {
  const t = e.target, m = state.modal;
  if (t.id === 'dealer-q') { enr.q = t.value; const hits = dealerMatches(enr.q), box = $('#dealer-opts'); box.innerHTML = dealerOpts(hits); box.hidden = !hits; }
  else if (t.id === 'manual-name') enr.manualName = t.value;
  else if (t.dataset.loc !== undefined) enr.manualLocs[+t.dataset.loc][t.dataset.k] = t.value;
  else if (m && t.dataset.c) m.contact[t.dataset.c] = t.value;
  else if (m && t.id === 'c-notes') m.notes = t.value;
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.cl) { const s = enr.campLocs[t.dataset.cl] || (enr.campLocs[t.dataset.cl] = new Set()); t.checked ? s.add(t.dataset.l) : s.delete(t.dataset.l); refreshEnroll(); }
  else if (t.dataset.loc !== undefined || t.id === 'manual-name') { ensureLocs(true); refreshEnroll(); }
  else if (t.id === 'ack' && state.modal) state.modal.ack = t.checked;
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (state.modal && state.modal.step !== 'done') state.modal = null; else state.drawer = null;
  render();
});
render();
// Tick the hero countdown without re-rendering the page; re-render once when it hits zero so the campaign closes.
setInterval(() => {
  const el = document.getElementById('timer');
  if (!el) return;
  const left = +el.dataset.end - Date.now();
  el.innerHTML = timerHTML(left);
  el.classList.toggle('urgent', left < 3 * 864e5);
  if (left <= 0) render();
}, 1000);
</script>
